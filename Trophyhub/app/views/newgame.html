{% extends "base.html" %}

{% block title %}Cadastrar Jogo - trophyHub{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h2>Cadastrar jogo<span>Hub</span></h2>

    <form method="POST" action="{{ url_for('auth.newgame') }}">
        <div class="form-group">
            <label for="nome">Nome do Jogo</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" name="genero" required>
        </div>
        <div class="form-group">
            <label for="conquistas">Conquistas (Separadas por vírgula)</label>
            <input type="text" id="conquistas" name="conquistas" placeholder="Ex: Conquista 1, Conquista 2" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Cadastrar Jogo</button>
    </form>
</div>
{% endblock %}
